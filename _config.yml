title: Veiler
description: Veiler の紹介ページと、プライバシーポリシー・利用規約
# The URLs the app and App Store Connect point at. Changing either of these
# breaks a link that ships inside a released binary, so they are pinned by the
# permalinks in each document rather than derived from file paths.
#
# The custom domain in CNAME is what lets this repository be renamed at all.
# GitHub does not redirect project-site URLs when a repository is renamed, so
# the site's address has to stop depending on the repository's name first. With
# baseurl empty, kyataoka.github.io/veiler-lp/privacy/ja/ redirects to
# veiler.kyatatata.com/privacy/ja/ — the repository segment is dropped and the
# rest of the path is kept, so a link written against the repository's own
# address still lands on the right page.
baseurl: ""
url: https://veiler.kyatatata.com
defaults:
  - scope:
      path: ""
    values:
      layout: document
exclude:
  - README.md
# jekyll-sitemap also writes robots.txt, pointing crawlers at the sitemap. A
# robots.txt committed to this repository replaces that generated file, so one
# added later has to carry the `Sitemap:` line itself.
plugins:
  - jekyll-sitemap
